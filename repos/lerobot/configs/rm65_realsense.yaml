# RM65 hardware profile for local RealMan RM65 + two Intel RealSense D435 cameras.
#
# Camera naming:
# - wrist: end-effector camera
# - front: overview camera that can see the whole arm
#
# This file is intended to be reused by LeRobot scripts that accept a top-level
# `robot` config, for example:
#   --config_path=configs/rm65_realsense.yaml
robot:
  type: rm65
  id: rm65

  ip: 192.168.1.18
  port: 8080
  socket_timeout_s: 3.0
  calibration_dir: /tmp/lerobot-rm65-calibration

  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "335222071948"
      width: 640
      height: 480
      fps: 30
      use_depth: false
      warmup_s: 1

    front:
      type: intelrealsense
      serial_number_or_name: "335522070090"
      width: 640
      height: 480
      fps: 30
      use_depth: false
      warmup_s: 1

  joint_names:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6

  joint_limits:
    joint_1: [-177.96, 177.96]
    joint_2: [-130.0, 130.0]
    joint_3: [-135.0, 135.0]
    joint_4: [-177.96, 177.96]
    joint_5: [-128.0, 128.0]
    joint_6: [-359.82, 359.82]

  max_relative_target: 1000.0

  use_canfd: true
  canfd_follow: true
  canfd_expand: 1000
  canfd_trajectory_mode: 0
  canfd_smooth: 0

  movej_speed: 20
  movej_blend_radius: 0
  movej_connect: 0

  # RM Plus pos[0] tracks the gripper position on this setup.
  use_gripper: true
  gripper_rm_plus_index: 0
  gripper_min: 1
  gripper_max: 1000
