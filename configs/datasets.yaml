schema_version: 1
dataset_root: runs/dataset

roles:
  standalone_source: Independently recorded dataset that is not assembled from local subsets.
  source_subset: Directly recorded task subset used to rebuild a canonical merged dataset.
  canonical_merge: Canonical robot dataset produced by merging source subsets.
  annotation_intermediate: Frame-aligned annotations that are not a standard robot-training dataset.
  derived_training: Robot dataset augmented with policy-specific supervision.

retention_states:
  keep_active: Required by current recording, training, or evaluation work.
  keep_source: Required to rebuild or extend a canonical dataset.
  keep_historical: Retained to reproduce a completed experiment.

datasets:
  rm65_aloha_pick_screwdriver_to_fixed_box_closer_front:
    path: rm65_aloha_pick_screwdriver_to_fixed_box_closer_front
    format: lerobot_v3
    role: standalone_source
    lifecycle: historical
    retention: keep_historical
    build:
      method: passive_record
      tool: repos/lerobot/examples/rm65/passive_record.py
    metadata:
      episodes: 250
      frames: 48106
      tasks: 1
      fps: 30
      cameras: [wrist, front]
    task_family: screwdriver_to_fixed_box
    used_by: [act]
    notes: Historical single-arm screwdriver dataset.

